<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Portfólio Web - Matheus">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E11D2E" />
      <stop offset="1" stop-color="#FF4D4D" />
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E11D2E" stop-opacity="0.9" />
      <stop offset="1" stop-color="#FF4D4D" stop-opacity="0.35" />
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="55" />
    </filter>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#E11D2E" opacity="0.28" />
    </pattern>
    <clipPath id="card">
      <rect width="900" height="260" rx="22" />
    </clipPath>
    <clipPath id="type">
      <rect x="168" y="146" height="36" width="0">
        <animate attributeName="width" values="0;172;172;0" keyTimes="0;0.4;0.9;1" dur="7s" repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>

  <!-- fundo -->
  <rect width="900" height="260" rx="22" fill="#0B0909" />
  <g clip-path="url(#card)">
    <rect width="900" height="260" fill="url(#dots)" />
    <circle cx="780" cy="40" r="150" fill="#E11D2E" opacity="0.35" filter="url(#blur)">
      <animate attributeName="opacity" values="0.22;0.45;0.22" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle cx="90" cy="250" r="120" fill="#FF4D4D" opacity="0.18" filter="url(#blur)">
      <animate attributeName="opacity" values="0.1;0.28;0.1" dur="6s" repeatCount="indefinite" />
    </circle>
  </g>
  <rect x="1" y="1" width="898" height="258" rx="21" fill="none" stroke="url(#border)" stroke-width="2" />

  <!-- logo -->
  <g transform="translate(64 52) scale(1.25)">
    <rect width="64" height="64" rx="14" fill="url(#g)" />
    <path d="M15 47V17h6.2l10.8 17.2L42.8 17H49v30h-6.4V28.2L33.6 42h-3.2l-9-13.8V47z" fill="#ffffff" />
  </g>

  <!-- titulo -->
  <text x="168" y="114" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="62" font-weight="800" letter-spacing="-1.5" fill="url(#g)">Portfólio Web</text>

  <!-- comando digitando -->
  <text x="168" y="172" font-family="ui-monospace, 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="24" fill="#FF4D4D" clip-path="url(#type)" textLength="172" lengthAdjust="spacing">$ npm run dev</text>
  <rect x="168" y="152" width="11" height="26" rx="2" fill="#FF4D4D">
    <animate attributeName="x" values="168;344;344;168" keyTimes="0;0.4;0.9;1" dur="7s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite" calcMode="discrete" />
  </rect>

  <!-- assinatura -->
  <text x="64" y="226" font-family="ui-monospace, 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="15" fill="#F5F5F5" fill-opacity="0.55">&lt;Matheus /&gt; · React + Vite</text>
</svg>
